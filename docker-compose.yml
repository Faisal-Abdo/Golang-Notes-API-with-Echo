services:
  postgres:
    image: postgres:17

    container_name: go-notes-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notesdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: go-notes-api

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notesdb?sslmode=disable
      # Must match the host:port clients use to obtain tokens, or issuer
      # validation fails - see README for the supported dev workflow.
      KEYCLOAK_URL: http://host.docker.internal:8081
      KEYCLOAK_REALM: notes-realm
      KEYCLOAK_CLIENT_ID: notes-api

  keycloak:
    image: quay.io/keycloak/keycloak:26.0

    container_name: keycloak

    ports:
      - "8081:8080"

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: root

    command: start-dev

    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  postgres_data:
  keycloak_data:
