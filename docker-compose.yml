services:
  postgres:
    image: postgres:17

    container_name: go-notes-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notesdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: go-notes-api

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notesdb?sslmode=disable

  keycloak:
    image: quay.io/keycloak/keycloak:26.0

    container_name: keycloak

    ports:
      - "8081:8080"

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: root

    command: start-dev

volumes:
  postgres_data:
